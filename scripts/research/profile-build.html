<div class="profile-build" role="group" aria-label="Profile A, tuned configuration and request-head signature">

    <div class="build-heading"><strong>Profile A</strong><span class="build-saved">Saved to bank</span><span class="build-active">Active</span><span class="build-drift">Drift</span></div>
    <div class="build-draft">

        <circle cx="130.59" cy="52.83" r="3"/>

        <circle cx="66" cy="79" r="4"/>
